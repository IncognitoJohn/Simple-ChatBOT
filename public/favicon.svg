<svg xmlns="http://www.w3.org/2000/svg" width="94" height="94" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="humphrey_grad" x1="18" y1="20" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D1D0D0"/>
      <stop offset="1" stop-color="#9C9488"/>
    </linearGradient>
    <linearGradient id="humphrey_ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEFEFE" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#D6CDD1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#565656" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#0B0D19"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="url(#humphrey_ring)" stroke-width="2"/>

  <!-- Antenna -->
  <rect x="30.5" y="11" width="3" height="10" rx="1.5" fill="#9C9488"/>
  <circle cx="32" cy="10" r="4" fill="#988686"/>

  <!-- Robot head -->
  <rect x="16" y="20" width="32" height="30" rx="10" fill="url(#humphrey_grad)"/>
  <rect x="16" y="20" width="32" height="30" rx="10" fill="none" stroke="#565656" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Eyes -->
  <circle cx="26" cy="35" r="3.6" fill="#0B0D19"/>
  <circle cx="38" cy="35" r="3.6" fill="#0B0D19"/>
  <circle cx="24.8" cy="33.8" r="1.1" fill="#FEFEFE" fill-opacity="0.95"/>
  <circle cx="36.8" cy="33.8" r="1.1" fill="#FEFEFE" fill-opacity="0.95"/>

  <!-- Mouth -->
  <rect x="24" y="42" width="16" height="3" rx="1.5" fill="#0B0D19" fill-opacity="0.75"/>
  <circle cx="27" cy="43.5" r="0.9" fill="#FEFEFE" fill-opacity="0.6"/>
  <circle cx="32" cy="43.5" r="0.9" fill="#FEFEFE" fill-opacity="0.6"/>
  <circle cx="37" cy="43.5" r="0.9" fill="#FEFEFE" fill-opacity="0.6"/>
</svg>

